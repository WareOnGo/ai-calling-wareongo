name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/postgres
      DATABASE_SSL: disable
      SESSION_SECRET: ci-session-signing-key-not-for-deployment
      ENABLE_ENRICHMENT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -- --init
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: node tests/rehearse-shared-schema.mjs 707f7971fa6982b73e502d3ef8cc3ee778b54848
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      EVAL_CONTAINER: bolna-fixes-pg
      PGPORT: '55439'
      EVAL_DB_URL: postgres://postgres:bolna-fixes-test-only@127.0.0.1:55439/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/browser
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm run db:up --prefix tests/browser
      - run: npm run test:stage -- build
      - run: npm run test:stage -- browser-production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            tests/browser/test-results
            tests/browser/playwright-report
